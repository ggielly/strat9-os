image: "rust:latest"

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

cache:
  paths:
    - .cargo/
    - target/

before_script:
  # The bootloader is a UEFI binary: it needs the x86_64-unknown-uefi target.
  # No NASM required: the old BIOS assembly stages are legacy and not built.
  - rustup target add x86_64-unknown-uefi

stages:
  - build

compilation:
  stage: build
  script:
    - cargo build --verbose --target x86_64-unknown-uefi
