[package]
name = "strat9-bootloader"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Guillaume Gielly <guillaume@gielly.fr>"]
description = "UEFI bootloader for strat9-os"

[[bin]]
name = "strat9-bootloader"
path = "src/main.rs"

[dependencies]
uefi = { version = "0.39", features = ["alloc", "global_allocator", "logger", "panic_handler"] }
x86_64 = "0.15"
log = "0.4"

# Re-use the ABI definitions from the kernel
strat9-abi = { workspace = true }

[features]
default = []
serial_debug = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
