[package]
name = "strat9-bootloader"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Guillaume Gielly <guillaume@gielly.fr>"]
description = "UEFI bootloader for strat9-os"

[[bin]]
name = "strat9-bootloader"
path = "src/main.rs"

[dependencies]
# `panic_handler` and `logger` are deliberately NOT enabled: both route output
# through firmware protocols that dereference gBS. After ExitBootServices
# EDK2 has set gBS = NULL, so a panic on the handoff path faults and kills
# QEMU. This crate installs its own firmware-free panic handler and uses only
# the 0x3F8/0xE9 ports, which are valid at any boot stage.
uefi = { version = "0.39", features = ["alloc", "global_allocator"] }
x86_64 = "0.15"
log = "0.4"

# Re-use the ABI definitions from the kernel
strat9-abi = { workspace = true }

[features]
default = []
serial_debug = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
