[package]
name = "strate-input"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Guillaume Gielly <guillaume@gielly.fr>"]
description = "Input server for strat9-os. Reads raw scancodes from /dev/input/kbd, translates to ASCII, and distributes events to clients."

[[bin]]
name = "input-server"
path = "src/main.rs"

[dependencies]
strat9-syscall = { path = "../syscall", features = ["userspace"] }
