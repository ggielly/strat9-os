[package]
name = "s9vm-console"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Guillaume Gielly <guillaume@gielly.fr>"]
description = "s9vm userspace console: world listing, diagnostic snapshots and guest console relay over /dev/vmm."

[[bin]]
name = "s9vm-console"
path = "src/main.rs"

[dependencies]
strat9-syscall = { path = "../syscall", features = ["userspace"] }
