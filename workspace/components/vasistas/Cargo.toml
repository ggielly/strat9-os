[package]
name = "vasistas"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Guillaume Gielly <guillaume@gielly.fr>"]
description = "Vasistas native display server for strat9-os: /srv/vasistas, private backbuffer, DisplayBackend over /dev/vasistas and DMG2 (jalon 4)."

[[bin]]
name = "vasistas"
path = "src/main.rs"
# Freestanding no_std/no_main image: it cannot link the host test harness.
test = false

[dependencies]
vasistas-core = { path = "../vasistas-core" }
vasistas-protocol = { path = "../vasistas-protocol" }
vasistas-backend = { path = "../vasistas-backend" }
input-client = { path = "../input-client" }
input-protocol = { path = "../input-protocol" }
strat9-syscall = { path = "../syscall", features = ["userspace"] }
