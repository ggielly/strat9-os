[package]
name = "strate-console"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Guillaume Gielly <guillaume@gielly.fr>"]
description = "Console silo for strat9-os. Terminal emulator, ANSI parser, glyph renderer, and shell running in userspace."

[[bin]]
name = "console"
path = "src/main.rs"

[dependencies]
strat9-syscall = { path = "../syscall", features = ["userspace"] }
alloc-freelist = { path = "../alloc-freelist" }
vte = { version = "0.15", default-features = false }
