[package]
name = "strat9-kernel"
version = "0.1.0"
edition = "2021"
license = "GPLv3"
authors = ["Guillaume Gielly <guillaume@gielly.fr>"]

[[bin]]
name = "kernel"
path = "src/main.rs"

[features]
default = []
selftest = []

[dependencies]
lru = { version = "0.12", default-features = false, features = ["hashbrown"] }
crossbeam-queue = { version = "0.3.12", default-features = false, features = [
    "alloc",
] }
smallvec = { version = "1.13", default-features = false }

heapless = { version = "0.9", default-features = false }
intrusive-collections = { version = "0.9", default-features = false, features = [
    "alloc",
] }
spin = { workspace = true }
bitflags = { workspace = true }
log = { workspace = true }
zerocopy = { workspace = true }
endian-num = { workspace = true }
num_enum = { version = "0.7", default-features = false }
thiserror = { version = "2", default-features = false }
static_assertions = "1.1"
xmas-elf = { version = "0.10", default-features = false }
strat9-abi = { workspace = true }
####
# strat9 components
component = { path = "libs/component" }
net-core = { path = "../drivers/nic/net-core" }
nic-buffers = { path = "../drivers/nic/nic-buffers" }
nic-queues = { path = "../drivers/nic/nic-queues" }
intel-ethernet = { path = "../drivers/nic/intel-ethernet" }
e1000 = { path = "../drivers/nic/e1000" }
driver-net-proto = { path = "../drivers/nic/driver-net-proto" }
ratatui = { version = "0.30.0", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# x86-only crates: the `x86_64` crate gates most of its API on
# target_arch = "x86_64" and its `instructions` feature; keeping them here
# lets the riscv64 build resolve without them.
x86_64 = "0.15"
raw-cpuid = "11.0.1"
uart_16550 = "0.4"
limine = "0.6.5"

[build-dependencies]
cc = "1.0"
nasm-rs = "0.3.2"
