# =============================================================================
# Strat9-OS boot configuration
# =============================================================================
# Read by the UEFI bootloader from the ESP at /boot/strat9.cfg and passed to
# the kernel as key=value environment entries. Values in this file are parsed
# BEFORE the loader defaults, so they win (the kernel returns the first match).
#
# Edit this file on the ESP to change a machine's behaviour without rebuilding.
# Blank lines and lines starting with '#' are ignored.

# Framebuffer console rendering mode:
#
#   auto   - default: "full" under a hypervisor (QEMU/KVM, VirtualBox, ...)
#                     and "lite" on bare metal.
#   full   - graphical console: boot art, status bar, scrollbar, cursors, TUI.
#   lite   - minimal text console, DOS-like: no decoration, no status bar, no
#            cursor sprites; only glyph cells and bulk row scrolling. This is
#            the fast mode for a real laptop panel.
#   serial - never touch the framebuffer at all. Everything is logged to COM1
#            and /dev/display stays absent. Fastest, and the right choice for
#            debugging over a USB-serial adapter.
#
console.mode=auto

# Serial console baud rate (loader default is 115200).
#console.baud=115200

# Disable all kernel debug output (serial + framebuffer). Production only.
#quiet=1
