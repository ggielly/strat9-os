# =============================================================================
# Strat9-OS boot configuration : s9vm graphical validation
# =============================================================================
# Variant of `strat9.cfg` used by `cargo make run-s9vm-iso`: it keeps the
# *graphical* framebuffer console (`console.mode=full`) instead of routing
# everything to the serial port, so the QEMU window shows the real console
# (boot art, status bar, shell and the ratatui TUIs such as `top`/`vmtop`),
# while the serial port still receives the kernel log for debugging.
#
# `console.mode` values: auto | full | lite | serial (see `strat9.cfg`).
#   full   - graphical console: boot art, status bar, scrollbar, cursors, TUI
#   lite   - minimal text console (fast, no decoration)
#   serial - no framebuffer at all
#
console.mode=full

# s9vm hardware phases at boot (they need VT-x: the KVM run exposes it).
# Set to a single phase (e.g. `freedos`) to boot a DOS-class VM instead.
s9vm.selftest=2
s9vm.selftest.deferred=1
s9vm.kthread_smoke=1

# Keep the boot quiet-ish on the serial log; the framebuffer shows the console.
#quiet=1
