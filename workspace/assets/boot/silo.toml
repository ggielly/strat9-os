[[silos]]
name = "inputd"
family = "SYS"
mode = "706"
sid = 42
provides = ["/srv/input"]
[[silos.strates]]
name = "inputd"
binary = "/initfs/input-server"
type = "elf"

[[silos]]
name = "bt"
family = "DRV"
mode = "076"
sid = 42
[[silos.strates]]
name = "strate-bt"
binary = "/initfs/strate-bt"
type = "elf"

[[silos]]
name = "console-admin"
family = "SYS"
mode = "706"
sid = 42
cpu_features = "sse2"
requires = ["/srv/input"]
[[silos.strates]]
name = "console-admin"
binary = "/initfs/console-admin"
type = "elf"

[[silos]]
name = "vasistas"
family = "SYS"
mode = "706"
sid = 42
provides = ["/srv/vasistas"]
[[silos.strates]]
name = "vasistas"
binary = "/initfs/vasistas"
type = "elf"

[[silos]]
name = "vasistas-demo"
family = "SYS"
mode = "706"
sid = 42
requires = ["/srv/vasistas"]
[[silos.strates]]
name = "vasistas-demo"
binary = "/initfs/vasistas-demo"
type = "elf"

[[silos]]
name = "vasistas-demo2"
family = "SYS"
mode = "706"
sid = 42
requires = ["/srv/vasistas"]
[[silos.strates]]
name = "vasistas-demo2"
binary = "/initfs/vasistas-demo"
type = "elf"

[[silos]]
name = "s9vm-console"
family = "SYS"
mode = "706"
sid = 42
requires = ["/srv/input"]
[[silos.strates]]
name = "s9vm-console"
binary = "/initfs/s9vm-console"
type = "elf"

[[silos]]
name = "s9vm-vmm"
family = "SYS"
mode = "700"
sid = 42
admin = true
[[silos.strates]]
name = "s9vm-vmm"
binary = "/initfs/s9vm-vmm"
type = "elf"

[[silos]]
name = "bus"
family = "DRV"
mode = "076"
sid = 42
provides = ["/bus", "/srv/strate-bus/default"]
[[silos.strates]]
name = "strate-bus"
binary = "/initfs/strate-bus"
type = "elf"
probe_mode = "full"

[[silos]]
name = "ramfs"
family = "FS"
mode = "076"
sid = 42
provides = ["/ram", "/srv/strate-fs-ramfs/default"]
[[silos.strates]]
name = "strate-fs-ramfs"
binary = "/initfs/strate-fs-ramfs"
type = "elf"

[[silos]]
name = "iommu"
family = "SYS"
mode = "716"
sid = 42
[[silos.strates]]
name = "strate-iommu"
binary = "/initfs/strate-iommu-silo"
type = "elf"

[[silos]]
name = "network"
family = "NET"
mode = "076"
sid = 42
requires = ["/srv/strate-bus/default"]
provides = ["/net"]
[[silos.strates]]
name = "strate-net"
binary = "/initfs/strate-net-silo"
type = "elf"

[[silos]]
name = "dhcp-client"
family = "NET"
mode = "076"
sid = 42
requires = ["/net"]
[[silos.strates]]
name = "dhcp-client"
binary = "/initfs/dhcp-client"
type = "elf"

[[silos]]
name = "telnet"
family = "NET"
mode = "076"
sid = 42
requires = ["/net"]
[[silos.strates]]
name = "telnetd"
binary = "/initfs/telnetd"
type = "elf"


[[silos]]
name = "web-admin"
family = "NET"
mode = "076"
sid = 42
requires = ["/net"]
graphics_enabled = true
graphics_mode = "webrtc-native"
graphics_max_sessions = 1
graphics_session_ttl_sec = 1800
graphics_turn_policy = "auto"
[[silos.strates]]
name = "web-admin"
binary = "/initfs/web-admin"
type = "elf"

[[silos]]
name = "graphics-webrtc"
family = "NET"
mode = "076"
sid = 42
requires = ["/net"]
[[silos.strates]]
name = "strate-webrtc"
binary = "/initfs/strate-webrtc"
type = "elf"

[policy]
admin_allow = ["s9vm-vmm"]
