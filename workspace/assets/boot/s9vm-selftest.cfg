# Strat9-OS boot configuration — s9vm validation
#
# Variant of `strat9.cfg` used for the s9vm virtualization engine
# validation ISO: fully serial console (log usable by a harness) and
# hardware smoke test requested at boot.
#
# The selftest is started only if the processor exposes VT-x/EPT: on a host
# without hardware virtualization (or QEMU in TCG), the kernel logs
# "platform not usable" and continues its normal boot.

console.mode=serial
s9vm.selftest=1
