# =============================================================================
# Strat9-OS boot configuration  : s9vm validation
# =============================================================================
# Variant of `strat9.cfg` used for the s9vm virtualization engine
# validation ISO: fully serial console (log usable by a harness) and
# hardware smoke tests requested at boot.
#
# `s9vm.selftest` values (each selects one phase, `2`/`all` runs every phase):
#   1 / true  device fast path (legacy PIC, in-kernel emulation)
#   irq       interrupt delivery (local APIC + interrupt window)
#   console   virtio console, transmit and receive
#   blk       virtio block request replay
#   net       virtio network transmit
#   loader    ELF64 guest image loaded and executed end to end
#   acpi      ACPI discovery (RSDP scan, checksum, XSDT/MADT walk)
#   smp       two vCPUs of one world, independent contexts (interleaved)
#   guestos   guest OS bootstrap (boot-parameter block, cmdline, module,
#             ACPI RSDP discovery and checksum, reported on the debug port)
#   2 / all   every phase (this image)
#
# `acpi` needs a registered vCPU and runs at the kthread stage: it is opt-in
# in the `2`/`all` mode with `s9vm.selftest.deferred=1`. `smp` also drives
# vCPUs through their kernel tasks and is enabled by the same deferred flag
# (or explicitly with `s9vm.selftest=smp`). `guestos` registers a detached
# vCPU (no scheduler) but is deferred with them, and is also enabled by the
# same flag or explicitly with `s9vm.selftest=guestos`. The diagnostic
# `s9vm.kthread_smoke=1` exercises the vCPU task path independently of VT-x.
#
# The tests are started only if the processor exposes VT-x/EPT: on a host
# without hardware virtualization (or QEMU in TCG), the kernel logs that the
# platform is not usable and continues its normal boot.
#
####
# s9vm.selftest=1        # device phase only
# s9vm.selftest=irq      # interrupt-delivery phase only
# s9vm.selftest=console  # virtio console phase only
# s9vm.selftest=blk      # virtio block phase only
# s9vm.selftest=net      # virtio network phase only
# s9vm.selftest=loader   # guest image loading phase only
# s9vm.selftest=acpi     # ACPI discovery phase only
# s9vm.selftest=smp      # multi-vCPU phase only
# s9vm.selftest=guestos  # guest OS bootstrap phase only
# s9vm.selftest=2        # every phase (current value)
# s9vm.selftest=all      # same as 2
####

console.mode=serial
s9vm.selftest=2

s9vm.selftest.deferred=1
s9vm.kthread_smoke=1
