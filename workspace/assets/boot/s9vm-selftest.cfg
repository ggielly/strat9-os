# Strat9-OS boot configuration — validation s9vm
#
# Variante de `strat9.cfg` utilisée pour l'ISO de validation du moteur de
# virtualisation s9vm : console entièrement série (journal exploitable par un
# harnais) et test de fumée matériel demandé au démarrage.
#
# Le selftest n'est lancé que si le processeur expose VT-x/EPT : sur un hôte
# sans virtualisation matérielle (ou QEMU en TCG), le noyau journalise
# « plateforme non exploitable » et poursuit son démarrage normalement.

console.mode=serial
s9vm.selftest=1
