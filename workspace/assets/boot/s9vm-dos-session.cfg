# =============================================================================
# Strat9-OS boot configuration : s9vm live FreeDOS session validation
# =============================================================================
# Boots the interactive-session selftest: the kernel creates a DOS world, boots
# the bundled FreeDOS 1.4 floppy, types `dir` through the console queue (the
# `vm send` path), resumes the same vCPU for a second slice and checks that the
# floppy listing reached the screen. It exercises the whole interactive path:
# 8259 IRQ delivery, 8042 keyboard, resumed vCPU, writable disk model.
#
# Serial console so a harness can read the PASS/FAIL line:
#   [s9vm] freedos-session PASS: booted to the prompt and typed `dir` ...
#
# The same path is available at the shell with `vm dos open` / `vm dos run` /
# `vm send <id> dir` / `vm console <id>` / `vm dos close`.
console.mode=serial
s9vm.selftest=freedos_session
