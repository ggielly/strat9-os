[book]
title = "Strat9 OS documentation"
description = "Architecture guide, ABI reference, and syscall documentation for Strat9 OS."
language = "en"
src = "src"

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://git.strat9-os.org/strat9-os/"
