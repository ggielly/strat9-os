stages:
    - test
    - test-qemu
    - build
    - release

variables:
    # GIT_STRATEGY: clone avoids fetching refs/pipelines/N (a GitLab-specific ref
    # created per pipeline by Gitaly). When Gitaly is under memory pressure it can
    # fail to create that ref (SIGKILL), causing every subsequent `fetch` strategy
    # job to fail with "couldn't find remote ref refs/pipelines/N".
    # clone does a fresh git clone each run and never looks up that ref.
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
    TZ: "Europe/Paris"

# L3/L4 QEMU gate — option A: strat9-builder VM on Proxmox
# shell runner tagged [qemu,kvm,proxmox].
# Each pipeline boots an EPHEMERAL QEMU process (trap-cleaned), no Limine:
# UEFI ISO with own strat9-bootloader.efi (cargo make selftest-iso-uefi).
# Provision the VM once: tools/ci/proxmox-make-builder.sh (on PVE host),
# then tools/ci/builder-provision.sh (inside the VM).
# Validated locally with: cargo make qemu-tests
build-selftest-iso:
    stage: test-qemu
    tags: [qemu, kvm, proxmox]
    timeout: 30 minutes
    before_script:
        - source "$HOME/.cargo/env" 2>/dev/null || true
        - rustup show active-toolchain || rustup toolchain install nightly-2026-07-20 --component rust-src llvm-tools
        - rustup target add x86_64-unknown-none x86_64-unknown-uefi 2>/dev/null || true
        - if ! command -v cargo-make &> /dev/null && ! cargo make --version &> /dev/null; then cargo install cargo-make; fi
    script:
        - bash tools/ci/build-selftest-iso.sh
    artifacts:
        paths:
            - build/strat9-os-selftest-uefi.iso
            - build/strat9-os-selftest-uefi.iso.sha256
        expire_in: 2 week

qemu-proxmox:
    stage: test-qemu
    tags: [qemu, kvm, proxmox]
    needs: [build-selftest-iso]
    allow_failure: true   # tighten to blocking once green for 2 weeks straight
    timeout: 30 minutes
    before_script:
        - source "$HOME/.cargo/env" 2>/dev/null || true
        - command -v qemu-system-x86_64 || { echo "qemu-system-x86_64 missing — re-run tools/ci/builder-provision.sh"; exit 2; }
        # The harness checks a matching OVMF CODE/VARS pair for this distro.
    script:
        - ./tools/scripts/qemu-selftest.sh --iso build/strat9-os-selftest-uefi.iso --timeout 180
    artifacts:
        paths:
            - build/qemu-selftest.log
            - build/qemu-selftest.log.qemu
        when: always
        expire_in: 2 week

test-host:
    stage: test
    before_script:
        - source "$HOME/.cargo/env" 2>/dev/null || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && source "$HOME/.cargo/env"
        - rustup show active-toolchain || rustup toolchain install nightly-2026-07-20 --component rust-src llvm-tools
        - rustup target add x86_64-unknown-linux-gnu 2>/dev/null || true
        - if ! command -v cargo-make &> /dev/null && ! cargo make --version &> /dev/null; then cargo install cargo-make; fi
    script:
        # L0/L1 anti-regression gate: ABI conformance + host-safe crates.
        # Kernel/no_std components are covered by L3 selftests + L4 QEMU jobs.
        - cargo make ci-tests

build-docs:
    stage: build
    before_script:
        - rustup default nightly || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && source "$HOME/.cargo/env" && rustup default nightly
        - rustup component add rust-src llvm-tools-preview
        - if ! command -v mdbook &> /dev/null; then cargo install mdbook --no-default-features --features search; fi
    script:
        - bash tools/scripts/build-docs-site.sh
    artifacts:
        paths:
            - build/docs-site

build-os-release:
    stage: build
    before_script:
        # Sudo is required here ONLY if the runner isn't run as root and the tools aren't already installed:
        # - sudo apt-get update && sudo apt-get install -y xorriso mtools
        - rustup default nightly || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && source "$HOME/.cargo/env" && rustup default nightly
        - rustup component add rust-src llvm-tools-preview
        - rustup target add x86_64-unknown-none
        - if ! command -v cargo-make &> /dev/null; then cargo install cargo-make; fi
    script:
        - cargo make uboot-image-release
    artifacts:
        paths:
            - build/strat9-os.iso
            - build/strat9-os.img
        expire_in: 12 week

release-latest:
    stage: release
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    needs:
        - job: build-os-release
          artifacts: true
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    variables:
        PKG_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/strat9-os/${CI_COMMIT_SHORT_SHA}"
    script:
        - |
            ISO_NAME="strat9-os-${CI_COMMIT_SHORT_SHA}.iso"
            IMG_NAME="strat9-os-${CI_COMMIT_SHORT_SHA}.img"
            test -f build/strat9-os.iso
            test -f build/strat9-os.img
            echo "==> Uploading ISO to package registry"
            curl --silent --show-error --fail \
              --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --upload-file build/strat9-os.iso \
              "${PKG_URL}/${ISO_NAME}"
            echo "==> Uploading IMG to package registry"
            curl --silent --show-error --fail \
              --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --upload-file build/strat9-os.img \
              "${PKG_URL}/${IMG_NAME}"
            echo "==> Uploads done"
    release:
        tag_name: "build-${CI_COMMIT_SHORT_SHA}"
        name: "Strat9-OS ${CI_COMMIT_SHORT_SHA}"
        description: "Automated build for commit ${CI_COMMIT_SHORT_SHA} : pipeline #${CI_PIPELINE_ID}"
        assets:
            links:
                - name: "strat9-os-${CI_COMMIT_SHORT_SHA}.iso"
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/strat9-os/${CI_COMMIT_SHORT_SHA}/strat9-os-${CI_COMMIT_SHORT_SHA}.iso"
                  link_type: other
                - name: "strat9-os-${CI_COMMIT_SHORT_SHA}.img"
                  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/strat9-os/${CI_COMMIT_SHORT_SHA}/strat9-os-${CI_COMMIT_SHORT_SHA}.img"
                  link_type: other
