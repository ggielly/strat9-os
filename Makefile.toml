# =============================================================================
# Legacy custom bootloader (NOT the active boot path - see limine-image)
# =============================================================================

[tasks.assemble-bootloader]
description = "LEGACY: assemble the custom BIOS bootloader (build/boot.bin)"
script_runner = "@shell"
script = ['''
bash tools/scripts/assemble-bootloader.sh
''']

[tasks.boot-disk]
description = "LEGACY: build a raw disk image with the custom bootloader + kernel at LBA 17"
dependencies = ["assemble-bootloader", "kernel-release"]
script_runner = "@shell"
script = ['''
bash tools/scripts/create-image.sh
''']

[tasks.test-boot]
description = "Boot test: kernel + serial output verification"
dependencies = ["limine-image"]
script_runner = "@shell"
script = ['''
timeout 30 ${QEMU} \
    -machine q35 \
    -cpu qemu64 \
    -smp 1 \
    -m 1G \
    -cdrom build/strat9-os.iso \
    -nographic \
    -no-reboot 2>&1 | head -50
''']

