[config]
default_to_workspace = false
skip_core_tasks = true

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
KERNEL_TARGET = "x86_64-unknown-none"
BUILD_DIR = "build"
QEMU = "qemu-system-x86_64"
GDB = "gdb"
QEMU_GDB_PORT = "1234"
STRAT9_PROFILE = "debug"
STRAT9_TAP_IFACE = "strat9tap0"
STRAT9_UPLINK_IFACE = "eth0"

# =============================================================================
# Build Tasks - Bootloader & Toolchain
# =============================================================================

[tasks.setup-limine]
description = "Download and setup Limine bootloader"
command = "bash"
args = ["tools/scripts/setup-limine.sh"]

[tasks.setup-musl]
description = "Clone/update external musl"
script_runner = "@shell"
script = ['''
    root_dir="$(pwd)"
    musl_dir="$root_dir/sdk/musl"
    if [ ! -d "$musl_dir/.git" ]; then
        rm -rf "$musl_dir"
        git clone git://git.musl-libc.org/musl "$musl_dir"
    fi
    ''']

[tasks.build-musl]
description = "Build musl static library for Strat9"
dependencies = ["setup-musl"]
script_runner = "@shell"
script = ['''
echo "Building musl for x86_64-unknown-strat9 target..."
cd sdk/musl
if [ ! -f config.mak ]; then
    ./configure CC=gcc --disable-shared
fi
make -j$(nproc)
echo ""
echo "=== Musl Build Complete ==="
echo ""
libmusl="lib/libc.a"
if [ -f "$libmusl" ]; then
    mkdir -p ../../target/x86_64-unknown-strat9/release/
    cp "$libmusl" ../../target/x86_64-unknown-strat9/release/libc.a
    cp "$libmusl" ../../target/x86_64-unknown-strat9/release/librelibc.a
    size=$(stat -c%s "$libmusl" 2>/dev/null || stat -f%z "$libmusl")
    size_kb=$((size / 1024))
    echo "  libc.a: $size bytes ($size_kb KB)"
else
    echo "  Warning: libc.a not found"
    exit 1
fi
echo ""
''']

# =============================================================================
# Build Tasks - Kernel
# =============================================================================

[tasks.kernel]
description = "Build the Strat9 kernel (debug profile, symbols enabled)"
cwd = "workspace/kernel"
command = "cargo"
args = ["build", "--target", "${KERNEL_TARGET}"]

[tasks.kernel-test]
description = "Build the Strat9 kernel (debug profile) with runtime self-tests"
cwd = "workspace/kernel"
command = "cargo"
args = ["build", "--target", "${KERNEL_TARGET}", "--features", "selftest"]

[tasks.kernel-release]
description = "Build the Strat9 kernel (release profile)"
cwd = "workspace/kernel"
command = "cargo"
args = ["build", "--release", "--target", "${KERNEL_TARGET}"]

[tasks.kernel-dev-opt]
description = "Build the Strat9 kernel (dev-opt profile)"
cwd = "workspace/kernel"
command = "cargo"
args = ["build", "--profile", "dev-opt", "--target", "${KERNEL_TARGET}"]

[tasks.check]
description = "Check kernel code without building"
cwd = "workspace/kernel"
command = "cargo"
args = ["check", "--target", "${KERNEL_TARGET}"]

[tasks.clippy]
description = "Run clippy on kernel code"
cwd = "workspace/kernel"
command = "cargo"
args = ["clippy", "--target", "${KERNEL_TARGET}"]

[tasks.fmt]
description = "Format all code"
command = "cargo"
args = ["fmt", "--all"]

# =============================================================================
# Image generation
# =============================================================================

[tasks.limine-image]
description = "Create bootable ISO/IMG with Limine + kernel (debug)"
dependencies = [
    "build-musl",
    "setup-limine",
    "kernel",
    "strate-ext4-release",
    "strate-fs-ramfs-release",
    "strate-init-release",
    "strate-console-admin-release",
    "strate-graphical-release",
    "strate-net-release",
    "strate-bus-release",
    "strate-wasm-release",
    "strate-webrtc-release",
    "dhcp-client-release",
    "ping-release",
    "telnetd-release",
    "udp-tool-release",
    "strate-web-admin-release",
]
env = { STRAT9_IMAGE_BASENAME = "strat9-os", STRAT9_INCLUDE_TESTS = "0" }
script_runner = "@shell"
script = ['''
bash tools/scripts/create-limine-image.sh
''']

[tasks.limine-image-release]
description = "Create bootable ISO/IMG with Limine + kernel (release)"
dependencies = [
    "build-musl",
    "setup-limine",
    "kernel-release",
    "strate-ext4-release",
    "strate-fs-ramfs-release",
    "strate-init-release",
    "strate-console-admin-release",
    "strate-graphical-release",
    "strate-net-release",
    "strate-bus-release",
    "strate-wasm-release",
    "strate-webrtc-release",
    "dhcp-client-release",
    "ping-release",
    "telnetd-release",
    "udp-tool-release",
    "strate-web-admin-release",
]
env = { STRAT9_IMAGE_BASENAME = "strat9-os", STRAT9_PROFILE = "release", STRAT9_INCLUDE_TESTS = "0" }
script_runner = "@shell"
script = ['''
bash tools/scripts/create-limine-image.sh
''']

# =============================================================================
# Run tasks
# =============================================================================

[tasks.run-gui-smp-release]
description = "Run kernel SMP release with GUI"
dependencies = ["limine-image-release"]
script_runner = "@shell"
script = ['''
${QEMU} \
    -machine q35 \
    -cpu qemu64 \
    -smp 4 \
    -m 2G \
    -cdrom build/strat9-os.iso \
    -drive file=qemu-stuff/disk.img,format=raw \
    -device virtio-gpu-gl \
    -display sdl,gl=on \
    -device usb-ehci \
    -device usb-kbd \
    -device usb-tablet \
    -device qemu-xhci \
    -device virtio-net-pci,netdev=net0 \
    -netdev user,id=net0,hostfwd=tcp::2222-:22 \
    -serial mon:stdio \
    -no-reboot
''']

[tasks.run-gui-smp-dev-opt]
description = "Run kernel SMP dev-opt with GUI"
dependencies = ["limine-image"]
script_runner = "@shell"
script = ['''
${QEMU} \
    -machine q35 \
    -cpu qemu64 \
    -smp 4 \
    -m 2G \
    -cdrom build/strat9-os.iso \
    -drive file=qemu-stuff/disk.img,format=raw \
    -device virtio-gpu-gl \
    -display sdl,gl=on \
    -device usb-ehci \
    -device usb-kbd \
    -device usb-tablet \
    -device qemu-xhci \
    -device virtio-net-pci,netdev=net0 \
    -netdev user,id=net0,hostfwd=tcp::2222-:22 \
    -serial mon:stdio \
    -no-reboot
''']

