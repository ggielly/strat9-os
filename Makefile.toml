# =============================================================================
# Utility tasks
# =============================================================================

[tasks.clean]
description = "Clean build artifacts"
script_runner = "@shell"
script = ['''
cargo clean
rm -rf build/iso_root build/strat9-os.img build/strat9-os.iso
''']

[tasks.doc]
description = "Build kernel documentation"
cwd = "workspace/kernel"
command = "cargo"
args = ["doc", "--target", "${KERNEL_TARGET}", "--no-deps"]

[tasks.size]
description = "Show kernel binary size"
cwd = "workspace/kernel"
script_runner = "@shell"
script = ['''
size target/${KERNEL_TARGET}/release/strat9-kernel 2>/dev/null || \
size target/${KERNEL_TARGET}/debug/strat9-kernel 2>/dev/null || \
echo "No kernel binary found"
''']

[tasks.docs-site]
description = "Build documentation site"
command = "bash"
args = ["tools/scripts/build-docs-site.sh"]

[tasks.docs-serve]
description = "Serve docs site locally on :8000"
dependencies = ["docs-site"]
command = "python3"
args = ["-m", "http.server", "--directory", "build/docs-site", "8000"]

